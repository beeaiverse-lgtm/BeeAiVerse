<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Bee AI Verse - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-shell">

    <a href="index.html" class="auth-eyebrow" style="color:var(--accent-mid); text-decoration:none;"><span class="pulse-dot"></span> Bee AI Verse Network</a>

    <div class="auth-bot">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="12" cy="13.5" rx="5.5" ry="6.5" stroke="#ff9d1c" stroke-width="1.5"/>
        <path d="M6.8 11h10.4M6.5 14h11M7.2 17h9.6" stroke="#ff9d1c" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="5.2" r="2.4" stroke="#ff9d1c" stroke-width="1.5"/>
        <path d="M10.3 3.2 9 1.6M13.7 3.2 15 1.6" stroke="#ff9d1c" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M5.5 10c-2.4-1.4-3.6-.2-3.6 1.6 0 1.8 2 2.4 3.6.9" stroke="#ff9d1c" stroke-width="1.2" opacity="0.7"/>
        <path d="M18.5 10c2.4-1.4 3.6-.2 3.6 1.6 0 1.8-2 2.4-3.6.9" stroke="#ff9d1c" stroke-width="1.2" opacity="0.7"/>
      </svg>
    </div>

    <div class="auth-border-glow">
      <div class="auth-inner-card">
        <h2 style="text-align:center;margin-bottom:6px;">Welcome Back</h2>
        <p style="text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:24px;">Sign in to your Bee AI Verse account</p>

        <form id="loginForm">
          <label for="email">Username or Email</label>
          <input type="text" id="email" required placeholder="BAV00001 or you@example.com" autocomplete="username">

          <label for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" style="padding-right:42px;">
            <button type="button" id="togglePassword" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <div style="text-align:right;margin-top:6px;">
            <a href="forgot-password.html" style="font-size:12px;color:var(--muted);">Forgot password?</a>
          </div>

          <button type="submit" class="btn" id="submitBtn" style="margin-top:18px;">Log In</button>
        </form>

        <div class="error-box" id="errorBox"></div>

        <div class="foot-note" style="margin-top:20px;text-align:center;font-size:13px;color:var(--text-dim);">
          Don't have an account? <a href="register.html">Register here</a>
        </div>
      </div>
    </div>

    <div class="auth-footnote">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-4z" stroke="currentColor" stroke-width="1.6"/></svg>
      Secured &amp; Encrypted
    </div>
    <div style="text-align:center;margin-top:14px;">
      <a href="index.html" style="font-size:12.5px;color:var(--muted);">← Back to Home</a>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
  (function () {
    const user = getUser();
    if (getToken() && user) {
      window.location.href = user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
    }
  })();

  document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('password');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    document.getElementById('eyeIcon').innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    try {
      const identifier = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!identifier) { showBox(errorBox, 'Please enter your username or email address.'); return; }
      if (!password) { showBox(errorBox, 'Please enter your password.'); return; }

      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ identifier, password })
      });

      saveSession(data.token, data.user);
      window.location.href = data.user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
    } catch (err) {
      showBox(errorBox, err.message || 'Login failed. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
